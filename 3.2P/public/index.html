<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIT 725 Task 3.2P - Student Recipes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Navbar -->
  <nav>
    <div class="nav-wrapper navbar-size">
      <a href="#" class="brand-logo"><i class="material-icons">restaurant_menu</i>Student Recipes</a>
      <ul id="nav-mobile" class="right hide-on-med-and-down">
        <li><a target="_blank" href="https://github.com/haiderkamran489">GitHub</a></li>
      </ul>
    </div>
  </nav>

  <main class="main-body">
    <div class="container">
      <div class="row">
        <div class="col s12 center-align">
          <h1 id="heading">Quick Recipes for Students</h1>
          <p class="flow-text">Cheap, simple meals you can cook in a shared kitchen. Click a card to see how to make it.</p>
        </div>
        <div class="col s12 center-align">
          <img class="materialboxed materialboxed-image" src="images/hero.jpg" alt="Cooking in a kitchen">
        </div>
        <div class="col s12 center-align">
          <a class="waves-effect waves-light btn add-recipe-button modal-trigger" data-target="modal1">
            <i class="material-icons left">add</i>Add a Recipe</a>
        </div>
      </div>

      <!-- Cards are added here from the GET /api/recipes endpoint -->
      <div class="row" id="card-section"></div>
    </div>

    <!-- Modal Structure -->
    <div id="modal1" class="modal modal-fixed-footer">
      <div class="row modal-content">
        <h5>Share a Recipe</h5>
        <form class="col s12">
          <div class="row">
            <div class="input-field col s8">
              <input id="recipe_title" type="text" class="validate">
              <label for="recipe_title">Recipe Name</label>
            </div>
            <div class="input-field col s4">
              <input id="cook_time" type="number" class="validate">
              <label for="cook_time">Time (minutes)</label>
            </div>
          </div>
          <div class="row">
            <div class="input-field col s12">
              <textarea id="ingredients" class="materialize-textarea"></textarea>
              <label for="ingredients">Ingredients</label>
            </div>
          </div>
          <div class="row">
            <div class="input-field col s12">
              <input id="email" type="email" class="validate">
              <label for="email">Your Email</label>
            </div>
          </div>
          <div class="row">
            <div class="input-field col s12 center-align">
              <a class="waves-effect waves-light btn add-recipe-button" id="formSubmit">Submit</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
